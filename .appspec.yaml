version: 0.1
os: linux
files:
  - source: /
    destination: /home/ec2-onethread/
hooks:
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 300
      runas: ec2-onethread
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: ec2-onethread
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: ec2-onethread