version: "3.3"
services:
    client: 
        image: client:2.0.0
        restart: always
        stdin_open: true
        ports:
            - "3000:3000"
        networks:
            - backend
    mongo:
        image: bitnami/mongodb:latest
        restart: always
        container_name: mongodb
        environment: 
            - MONGODB_DATABASE=tigrowdev
        volumes:
            - ./mongodb:/data/db/
        networks:
            - backend
        ports: 
            - '27017:27017'

        logging:
            driver: "json-file"
            options:
               max-size: "100MB"
               max-file: "3"
               
    redis:
        image: bitnami/redis:latest
        restart: always
        container_name: redis_cache
        environment:
            - ALLOW_EMPTY_PASSWORD=yes
        volumes: 
            - ./redis-data:/data
        networks:
            - backend
        ports: 
            - '6379:6379'
    elastic_local:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.6.2
        container_name: elastic_local    
        environment:
            - node.name=es01
            - cluster.name=es-docker-cluster
            - discovery.type=single-node
            - bootstrap.memory_lock=true
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      
        ulimits:
          memlock:
              soft: -1
              hard: -1
        ports: 
            - '9200:9200'
            - '9300:9300'
        networks: 
            - backend
    backend:
        image: backend:2.0.0
        restart: always
        ports:
            - "4044:4044"
        environment: 
             -  MONGO_HOST=mongodb://mongo:27017/tigrowdev
             -  REDIS_HOST=redis
             -  REDIS_PORT=6379
             -  ELASTIC_SEARCH_ADDRESS=http://elastic_local:9200
        depends_on:
            - mongo
            - redis
            - elastic_local
        networks:
            - backend


networks:
    backend:
        driver: bridge
