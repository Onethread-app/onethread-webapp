input {
    file {
        path => "/home/tigrow/tigrow/TiGrowWebApp/backend/tigrow.log"
        start_position => "beginning"
    }
}

filter {
    grok {
        match => { "message" => "%{IP:ip_address} \[%{HTTPDATE:req_ts}\] \"%{WORD:http_verb} %{URIPATHPARAM:req_path}\"" }
        # match => {"message" => "%{HTTPD_COMBINEDLOG}"}
    }
}

output {
    elasticsearch {
          hosts => ["http://localhost:9200"]
          index => "tigrow_log"
          document_type => "default"
          http_compression => true
    }
    stdout {
        codec => rubydebug
    }
}